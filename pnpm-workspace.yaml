blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - webpack
  - react
  - react-dom
  - next
  - "@next/*"
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23
  # Renovate security update: sharp@0.35.5
  - sharp@0.35.5
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: nodemailer@10.1.4
  - nodemailer@10.1.4
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 20160
allowBuilds:
  esbuild: set this to true or false
  msw: true
  sharp: true
  unrs-resolver: set this to true or false
